<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>サーバーサイド課題アプリ</title>
</head>
<body>
    <h1>メッセージ送信アプリ</h1>
    <form method="POST">
        <input type="text" name="username" placeholder="名前を入力" required>
        <button type="submit">送信</button>
    </form>

    {% if message %}
        <p><strong>{{ message }}</strong></p>
    {% endif %}
</body>
</html>
